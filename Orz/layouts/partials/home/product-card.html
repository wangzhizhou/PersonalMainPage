{{- /* 入参：产品数据 map（来自 data/products.yaml） */ -}}
<article class="product-card">
  <div class="product-card-top">
    <span class="product-icon" aria-hidden="true">{{ .icon | default "📦" }}</span>
    {{ with .status }}<span class="product-status">{{ . }}</span>{{ end }}
  </div>
  <h3>{{ .name }}</h3>
  <p class="product-tagline">{{ .tagline }}</p>
  <p class="product-desc">{{ .description }}</p>
  {{ with .tags }}
    <div class="product-tags">
      {{ range . }}<span>{{ . }}</span>{{ end }}
    </div>
  {{ end }}
  <a class="product-link" href="{{ .url }}" target="_blank" rel="noopener">
    {{ with .category }}{{ . }}{{ else }}访问产品{{ end }} <span aria-hidden="true">↗</span>
  </a>
</article>
