# baseURL 不在仓库里写死：生产构建由 scripts/build_site.sh
# 从 SITE_URL / GitHub Pages 配置 / gh-pages CNAME 动态解析后传入。
baseURL = "/"
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
title = "王志舟 · JokerHub"
theme = "PaperMod"
copyright = "© 王志舟"
enableEmoji = true
enableRobotsTXT = true
pygmentsUseClasses = true
pygmentsCodeFences = true

[params]
  description = "王志舟（Joker）的个人主页：独立开发者、iOS / Swift 开发者，这里展示我的产品、项目与文字。"
  keywords = ["王志舟", "Joker", "iOS", "Swift", "Vapor", "独立开发", "产品"]
  author = "王志舟"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  disableScrollToTop = false
  ShowReadingTime = true
  ShowWordCount = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowToc = true
  mainSections = ["post"]
  hideFooter = true
  blogURL = "https://blog.jokerhub.cn"

  [params.label]
    text = "JokerHub"

  [params.assets]
    favicon = "/images/favicon.ico"
    favicon16x16 = "/images/favicon-16x16.png"
    favicon32x32 = "/images/favicon-32x32.png"
    apple_touch_icon = "/images/apple-touch-icon.png"
    safari_pinned_tab = "/images/safari-pinned-tab.svg"
    theme_color = "#0f172a"
    msapplication_TileColor = "#0f172a"

  [params.legal]
    icp = "京ICP备18007462号-2"
    icpLink = "https://beian.miit.gov.cn"
    police = "京公网安备 11010802035662号"
    policeLink = "http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=11010802035662"
    policeIcon = "/images/ghs.png"

  [params.home]
    eyebrow = "你好，我是"
    name = "王志舟"
    alias = "Joker"
    status = "独立开发者 · iOS / Swift"
    tagline = "全栈折腾 · Minecraft · Chiptune"
    description = "白天写 Swift，晚上折腾服务器、博客和芯片音乐。"
    productsTitle = "精选产品"
    productsSubtitle = "几个最近在做的产品，完整清单见产品全览。"
    avatar = "/images/avatar.jpg"

  [params.contact]
    email = "824219521@qq.com"
    text = "✉️ 邮件联系"

[[params.socialIcons]]
  name = "github"
  title = "GitHub"
  url = "https://github.com/wangzhizhou"

[[params.socialIcons]]
  name = "youtube"
  title = "YouTube"
  url = "https://www.youtube.com/@wangzhizhou"

[[params.socialIcons]]
  name = "email"
  title = "Email"
  url = "mailto:824219521@qq.com"

