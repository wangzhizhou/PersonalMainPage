# 维护方式：新增产品时在对应 group 的 products 下追加一条记录即可。
#
# 字段说明：
#   group.site / github    组织主页与 GitHub 主页
#   product.name           产品名称
#   group.icon / product.icon  卡片图标（Lucide 图标名，见 layouts/partials/icon.html）
#   product.status         状态标签，如版本号、「已上架」「持续更新」
#   product.tagline        一句话介绍
#   product.description    详细介绍
#   product.features       功能要点列表
#   product.tags           技术 / 分类标签
#   product.links          外链列表；primary: true 的主按钮高亮显示

